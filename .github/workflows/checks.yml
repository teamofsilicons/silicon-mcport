name: Development checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Formatting, workspace tests, strict Clippy, script and packaging tests, the three
      # Silicon Apps discovery commands against the CLI the tests built, the web, and the
      # real-binary end-to-end journey (tests/e2e) against a fake Silicon Accounts and MCP
      # fixtures on loopback ports.
      - name: Rust, scripts, discovery commands, web and end-to-end journey
        run: python scripts/check.py --e2e-run-dir "$RUNNER_TEMP/mcport-e2e"
      - name: Keep the end-to-end logs when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcport-e2e-logs
          path: ${{ runner.temp }}/mcport-e2e
          if-no-files-found: ignore
          retention-days: 7
