name: Development checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Formatting, workspace tests, strict Clippy, script and packaging tests, the three
      # Silicon Apps discovery commands against the CLI the tests built, and the web.
      # --skip-e2e: the real-binary journey in tests/e2e still drives the sign-in that
      # 0.3.0 removed; it runs here again once it signs in with Silicon Accounts fixtures.
      - name: Rust, scripts, discovery commands and web
        run: python scripts/check.py --skip-e2e
