name: Native backend candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Optional successful CLI release run to verify on native catalog runners
        required: false
        default: ''
      source_revision:
        description: Exact CLI candidate source commit
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: backend-candidate-${{ github.ref }}
  cancel-in-progress: false
# The bundle is the service alone; the website is a separate Next.js deployment.
jobs:
  server:
    if: inputs.candidate_run == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    env:
      # Official ARM64 AL2023 image observed October 4, 2026. Immutable base.
      BUILD_IMAGE: public.ecr.aws/amazonlinux/amazonlinux@sha256:bdaba6be6ef19640b0a8149f845972d8b2b5189c44cd5ed9b3402cc4269ff71d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native tests, release build and health smoke on AL2023
        run: |
          docker run --rm --platform linux/arm64 \
            -e SOURCE_REVISION="$GITHUB_SHA" -e BUILD_IMAGE \
            -v "$PWD:/src" -w /src "$BUILD_IMAGE" bash -euo pipefail -c '
              dnf install -y gcc gcc-c++ make perl tar gzip git findutils python3 binutils curl-minimal
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              source /root/.cargo/env
              export CARGO_TARGET_DIR=/src/target/backend-al2023
              export MCPORT_TEST_PYTHON=/usr/bin/python3
              export MCPORT_BUILD_REVISION="$SOURCE_REVISION"
              test "$(uname -m)" = aarch64
              cargo test --locked -p mcport-server -p mcport-core -p mcport-mcp
              cargo build --locked --release -p mcport-server
              mkdir -p backend-build
              install -m 0755 "$CARGO_TARGET_DIR/release/mcport-server" backend-build/mcport-server
              ldd backend-build/mcport-server > backend-build/ldd.txt
              readelf --version-info backend-build/mcport-server > backend-build/elf-versions.txt
              python3 scripts/backend_smoke.py --binary backend-build/mcport-server \
                --revision "$SOURCE_REVISION" --image "$BUILD_IMAGE" \
                --output backend-build/provenance.json
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-server
          path: backend-build/*
          if-no-files-found: error
          retention-days: 14
  assemble:
    if: inputs.candidate_run == ''
    needs: [server]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backend-server
          path: backend-build
      - name: Restore executable bit lost by artifact transfer
        run: chmod 755 backend-build/mcport-server
      - name: Test bundle and installer rejection rules
        run: python -m unittest discover -s scripts/tests -p test_backend_package.py
      - name: Package exact revision and validate without installation
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python scripts/package_backend.py --binary backend-build/mcport-server \
            --provenance backend-build/provenance.json \
            --revision "$SOURCE_REVISION" \
            --output "candidate/mcport-backend-$SOURCE_REVISION-linux-aarch64.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcport-backend-candidate
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
# Candidate only: no production credentials, upload, installation or deployment.
  catalog-proof:
    if: inputs.candidate_run != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: linux-aarch64 }
          - { runner: macos-15-intel, target: macos-x86_64 }
          - { runner: macos-15, target: macos-aarch64 }
          - { runner: windows-2025, target: windows-x86_64 }
          - { runner: windows-11-arm, target: windows-aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify candidate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > candidate.json
          python - <<'PYPROOF'
          import json, os
          r=json.load(open('candidate.json'))
          assert r['head_sha']==os.environ['SOURCE_REVISION'] and r['conclusion']=='success'
          assert r['path']=='.github/workflows/release.yml'
          PYPROOF
      - uses: actions/download-artifact@v4
        with:
          name: mcport-silicon-apps-release
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run }}
      - name: Execute exact packaged bytes
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          archive=$(find candidate -name "mcport-*-$TARGET.tar.gz")
          python scripts/native_catalog_proof.py --app mcport --archive "$archive" --target "$TARGET" --source-revision "$SOURCE_REVISION" --candidate-run "$CANDIDATE_RUN" --output "proof/mcport-$TARGET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mcport-catalog-proof-${{ matrix.target }}
          path: proof/
          if-no-files-found: error
