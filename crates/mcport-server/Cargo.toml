[package]
name = "mcport-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mcport-core = { path = "../mcport-core", version = "0.2.0" }
mcport-mcp = { path = "../mcport-mcp", version = "0.2.0" }
silicon-iam-client = "=5.2.1"
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
subtle = "2"
hmac = "0.12"
space-station = "=0.3.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
