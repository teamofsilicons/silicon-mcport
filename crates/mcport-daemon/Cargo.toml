[package]
name = "mcport-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Outbound local MCP host connector for Silicon MCPort"

[dependencies]
mcport-core = { path = "../mcport-core", version = "0.1.0" }
mcport-client = { path = "../mcport-client", version = "0.1.0" }
mcport-mcp = { path = "../mcport-mcp", version = "0.1.0" }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"
fs2 = "0.4"
sha2 = "0.10"
tracing = "0.1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
axum = "0.8"
