[package]
name = "mcport-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded MCP transports and execution for Silicon MCPort"

[dependencies]
async-stream = "0.3"
bytes = "1"
futures = "0.3"
http = "1"
jsonschema = { version = "0.58.5", default-features = false }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client", "elicitation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sse-stream = "0.2.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
