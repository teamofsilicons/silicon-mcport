[package]
name = "mcport-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Primary Rust interface for Silicon MCPort: the API client, Silicon Accounts sign-in and explicit local host support"

[features]
default = ["accounts"]
# Sign in with Silicon Accounts as MCPort's public client: the device flow for
# Carbons, short-lived tokens for Silicons, refresh and sign-out. Stateless.
accounts = ["dep:silicon-accounts-client", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio", "dep:url"]
# Keep a sign-in in one explicit file: owner-only, atomic writes, single-flight
# refresh under a file lock.
session = ["accounts", "dep:fs2"]
# Explicit local host registries and the embedded host connector.
local = ["dep:mcport-daemon", "dep:mcport-mcp", "dep:serde_json", "dep:thiserror", "dep:fs2", "dep:tokio", "dep:tokio-util"]

[dependencies]
mcport-api = { path = "../mcport-api", version = "0.3.0" }
mcport-daemon = { path = "../mcport-daemon", version = "0.3.0", optional = true }
mcport-mcp = { path = "../mcport-mcp", version = "0.3.0", optional = true }
silicon-accounts-client = { version = "0.4.0", optional = true }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "form"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
fs2 = { version = "0.4", optional = true }
tokio = { version = "1", features = ["time"], optional = true }
tokio-util = { version = "0.7", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
# The crate's own tests use every feature, so `cargo test -p mcport-client` runs
# them all (tests/sign_in.rs needs `session`). Path-only: removed on publish.
mcport-client = { path = ".", features = ["accounts", "session", "local"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tempfile = "3"
axum = "0.8"
