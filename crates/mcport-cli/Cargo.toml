[package]
name = "mcport-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for Silicon MCPort"

[[bin]]
name = "mcport"
path = "src/main.rs"

[dependencies]
mcport-client = { path = "../mcport-client", version = "0.1.0", features = ["local"] }
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "process"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
dirs = "6"
sha2 = "0.10"
rpassword = "7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
axum = "0.8"
